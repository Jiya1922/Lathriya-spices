{% extends "base.html" %}
{% load static %}

{% block title %}Sign In with Google | Lathriya Spices{% endblock %}

{% block css %}
<style>
    .sso-confirm {
        min-height: 80vh;
        background:
            linear-gradient(135deg, rgba(2,45,17,.88) 0%, rgba(13,64,30,.82) 50%, rgba(27,94,32,.75) 100%),
            url("{% static 'images/logo-background.webp' %}");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
    }

    .sso-card {
        background: rgba(255,255,255,.95);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(212,160,23,.25);
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0,0,0,.35);
        padding: 45px 40px;
        max-width: 440px;
        width: 100%;
        text-align: center;
    }

    .sso-card .sso-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #4285f4, #34a853);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
    }
    .sso-card .sso-icon i {
        color: white;
        font-size: 26px;
    }

    .sso-card h2 {
        color: #022d11;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .sso-card h2 span { color: #D4A017; }

    .sso-card p {
        color: #777;
        font-size: 14px;
        margin-bottom: 28px;
        line-height: 1.6;
    }

    .sso-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px 36px;
        background: linear-gradient(135deg, #1B5E20, #2E7D32);
        color: white;
        border: none;
        border-radius: 40px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: .3s;
        cursor: pointer;
    }
    .sso-btn:hover {
        background: linear-gradient(135deg, #14481a, #1B5E20);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(27,94,32,.3);
    }

    .sso-back {
        display: block;
        margin-top: 18px;
        color: #999;
        font-size: 13px;
        text-decoration: none;
        transition: .3s;
    }
    .sso-back:hover { color: #D4A017; }
</style>
{% endblock %}

{% block content %}
<section class="sso-confirm">
    <div class="sso-card">

        <div class="sso-icon">
            <i class="fab fa-google"></i>
        </div>

        <h2>Sign in with <span>Google</span></h2>
        <p>Redirecting you to Google for secure sign-in...</p>

        <form method="post" id="ssoForm">
            {% csrf_token %}
            <button type="submit" class="sso-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Continue
            </button>
        </form>

        <a href="{% url 'shop' %}" class="sso-back">
            <i class="fa-solid fa-arrow-left"></i> Back to shop
        </a>

    </div>
</section>

<script>
    /* Auto-submit the form so the user never has to click again */
    document.getElementById('ssoForm').submit();
</script>

{% endblock %}
